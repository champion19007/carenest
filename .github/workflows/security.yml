name: Security Scan

on:
  pull_request:

permissions:
  contents: read
  # Required to publish findings.sarif to the Security tab.
  security-events: write

concurrency:
  group: carenest-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strix-scan:
    runs-on: ubuntu-latest
    # Without a model key the scan cannot run; skip rather than fail every PR
    # until the secrets are set.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Diff scoping needs the base branch present, not a shallow clone.
          fetch-depth: 0

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run security scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: strix -n -t ./ --scan-mode quick --max-budget 10

      # Exit 0 means "nothing validated in what was analysed", which is not the
      # same as "fully analysed". A run cut off at the hard budget still exits 0
      # with status "stopped", so gate on completion as well as exit code.
      - name: Fail unless the scan completed
        if: always()
        run: |
          run_json=$(ls -t strix_runs/*/run.json 2>/dev/null | head -1)
          if [ -z "$run_json" ]; then
            echo "No strix_runs/*/run.json — the scan never started." >&2
            exit 1
          fi
          status=$(jq -r .status "$run_json")
          cost=$(jq -r '.llm_usage.cost // 0' "$run_json")
          echo "status=$status cost=\$$cost of \$10 budget"
          if [ "$status" != "completed" ]; then
            echo "Scan did not complete (status '$status'); raise --max-budget." >&2
            exit 1
          fi

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs
