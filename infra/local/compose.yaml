name: carenest-local-services
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_DB: carenest_local
      POSTGRES_USER: carenest
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carenest -d carenest_local"]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 768m
    cpus: 1
secrets:
  postgres_password:
    file: ../../.data/infrastructure/postgres-password
volumes:
  postgres_data:
